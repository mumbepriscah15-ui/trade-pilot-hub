<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DERIV PILOT HUB - Trading System</title>
<script src="https://s3.tradingview.com/tv.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Inter,sans-serif}
body{background:#0a0a0f;color:#fff;overflow:hidden}
#loader{position:fixed;inset:0;background:#0f0a1e;z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center}
.circle{width:60px;height:60px;border:3px solid #222;border-top-color:#7c3aed;border-radius:50%;animation:spin 1s linear infinite;margin:20px 0}
@keyframes spin{to{transform:rotate(360deg)}}
.bar{width:300px;height:4px;background:#222;border-radius:2px;overflow:hidden;margin-top:20px}
.fill{height:100%;background:#fff;width:0%;transition:width 0.2s}
.header{height:48px;background:#15151e;border-bottom:1px solid #222;display:flex;justify-content:space-between;align-items:center;padding:0 12px}
.nav{display:flex;gap:6px;padding:10px;background:#0f0f14;overflow-x:auto;white-space:nowrap;border-bottom:1px solid #222}
.tab{padding:8px 14px;border-radius:8px;background:#1e1e2a;font-size:12px;font-weight:600;cursor:pointer;border:1px solid #2a2a3a}
.tab.active{background:#7c3aed;border-color:#7c3aed}
.main{display:flex;height:calc(100vh - 96px)}
.left{width:380px;background:#fff;color:#000;overflow-y:auto}
.left.dark{background:#15151e;color:#fff}
.content{flex:1;background:#0f0f14;overflow-y:auto;position:relative}
.card{padding:14px;border-bottom:1px solid #eee}
.bot-row{display:flex;justify-content:space-between;gap:10px;padding:12px;border:1px solid #e5e7eb;border-radius:10px;margin-bottom:8px;background:#f9fafb}
.btn-load{background:#7c3aed;color:#fff;border:none;padding:8px 16px;border-radius:8px;font-weight:700;cursor:pointer}
.digit-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;padding:12px}
.d-circle{aspect-ratio:1;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;border:2px solid #e5e7eb;background:#fff;position:relative}
.d-circle b{font-size:18px}.d-circle small{font-size:10px;color:#888}
.d-circle.active{border-color:#10b981;transform:scale(1.1);box-shadow:0 0 15px #10b981}
.big-digit{width:70px;height:70px;border-radius:50%;background:#fff;color:#000;display:flex;align-items:center;justify-content:center;font-size:32px;font-weight:800;margin:10px auto;border:3px solid #7c3aed}
.market-item{display:flex;justify-content:space-between;padding:12px;border-radius:10px;margin:4px 8px;background:#f9fafb;cursor:pointer;border:1px solid transparent}
.market-item.active{background:#ede9fe;border-color:#7c3aed}
.payout{display:flex;gap:10px;padding:12px}
.payout button{flex:1;padding:14px;border-radius:12px;border:none;font-weight:800;font-size:14px;cursor:pointer}
.over{background:#10b981;color:#fff}.under{background:#ef4444;color:#fff}
select,input{width:100%;padding:10px;border-radius:8px;border:1px solid #ddd;margin:6px 0;background:#fff;color:#000}
@media(max-width:800px){.main{flex-direction:column}.left{width:100%;height:50vh}.content{height:50vh}}
</style>
</head>
<body>
<div id="loader">
<h1>DERIV PILOT HUB</h1>
<p style="letter-spacing:6px;font-size:10px;color:#aaa">TRADING SYSTEM</p>
<div class="circle"></div>
<div id="loadText">Please wait while we connect to the server...</div>
<small style="margin-top:10px;color:#888">Powered by <span style="color:#ff444f">Deriv</span></small>
<div class="bar"><div class="fill" id="fill"></div></div>
<div id="pct" style="margin-top:8px">20%</div>
</div>
<div class="header">
<div style="font-weight:800;letter-spacing:2px">DERIV PILOT HUB</div>
<div style="display:flex;gap:6px;align-items:center"><span style="background:#1e1e2a;color:#fff;padding:4px 8px;border-radius:6px;font-size:11px">USD - 20.00 USD</span><span style="background:#7c3aed;padding:4px 8px;border-radius:6px;font-size:11px">Cashier</span></div>
</div>
<div class="nav" id="nav"></div>
<div class="main">
<div class="left dark" id="leftPanel"></div>
<div class="content" id="rightPanel"></div>
</div>
